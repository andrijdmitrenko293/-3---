    <!-- Меню-індикатор з цифрами (Завдання для самостійного виконання №2) -->
    <aside>
        <ol>
            <li>1</li>
            <li>2</li>

    <main>
        <h1>Запис на прийом</h1>

        <!-- Форма запису (Завдання для самостійного виконання №1) -->
        <form action="#" method="post">
            <p>
                <label for="username">ПІБ власника:</label><br>
                <input type="text" id="username" name="username" required placeholder="Введіть ваше ім'я">
            </p>

            <p>
                <label for="phone">Номер телефону:</label><br>
                <input type="tel" id="phone" name="phone" required placeholder="+380...">
            </p>

            <p>
                <label for="pet_type">Вид тварини:</label><br>
                <select id="pet_type" name="pet_type">
                    <option value="dog">Собака</option>
                    <option value="cat">Кіт / Кішка</option>
                    <option value="rodent">Гризун</option>
                    <option value="bird">Птах</option>
                    <option value="other">Інше</option>
                </select>
            </p>

            <p>
                <label for="comments">Причина звернення / скарги:</label><br>
                <textarea id="comments" name="comments" rows="4" cols="30" placeholder="Опишіть симптоми..."></textarea>
            </p>

            <p>
                <input type="submit" value="Відправити запис">
            </p>
        </form>

        <br>
        <a href="index.html">Назад на головну</a>
    </main>
